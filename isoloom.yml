# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# CloudGoat's rce_web_app scenario by Rhino Security Labs
# (https://github.com/RhinoSecurityLabs/cloudgoat), in your own AWS account.
# Source in app/ (upstream, unchanged); terraform/ is this lab's wrapper around the scenario's own
# terraform/ folder, feeding it what CloudGoat's CLI would.
# Run: `aws login`, then `isoloom run cloud-services`; end it with `isoloom down cloud-services`.
# Your public IP is the only address its instances accept: the launch-time input PLAYER_CIDR
# (`down` reuses the value `run` was given):
#   PLAYER_CIDR=$(curl -s https://checkip.amazonaws.com)/32 isoloom run cloud-services
version: 1
name: cloudgoat-rce-web-app
inputs: [PLAYER_CIDR]

cloud:
  provider: aws
  terraform: terraform
  vars:
    region: us-east-1
    profile: default
    whitelist: "{{ inputs.PLAYER_CIDR }}"
  outputs:
    lara_access_key_id: lara_access_key_id
    lara_secret_key: lara_secret_key
    mcduck_access_key_id: mcduck_access_key_id
    mcduck_secret_key: mcduck_secret_key
  hourly_usd: 0.07

checks:
  - name: the user Lara can sign in and the load balancer serves the web application
    script: checks/start.sh
    wait: 600

message: |
  You are the IAM user Lara (or, for the second route, McDuck):
    aws configure --profile lara     # access key {{ cloud.outputs.lara_access_key_id }}
                                     # secret key {{ cloud.outputs.lara_secret_key }}
    aws configure --profile mcduck   # access key {{ cloud.outputs.mcduck_access_key_id }}
                                     # secret key {{ cloud.outputs.mcduck_secret_key }}
  Goal: the secret in the scenario's RDS database. Cheat sheets:
  app/cloudgoat/scenarios/aws/rce_web_app/cheat_sheet_lara.md and cheat_sheet_mcduck.md
